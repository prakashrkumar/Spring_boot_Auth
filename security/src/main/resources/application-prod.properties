# Server Configuration
server.port=8082

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Security Logging
logging.level.org.springframework.security=DEBUG

# JWT Configuration
security.jwt.secret=${JWT_SECRET:myDefaultSecretKeyForDevelopmentOnlyDoNotUseInProductionEnvironment12345}
security.jwt.issuer=${JWT_ISSUER:api.substring.com}

# JWT Expiration Time (Seconds)
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:6000}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}

# Refresh Token Cookie Configuration
security.jwt.refresh-token-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:lax}
security.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:localhost}

# OAuth2 Configuration - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test-client-secret}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# OAuth2 Configuration - GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:test-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 Frontend Redirect URLs
app.auth.frontend.success-redirect=${FRONT_END_SUCCESS_REDIRECT:http://localhost:5173/oauth/success}
app.auth.frontend.failure-redirect=${FRONT_END_FAILURE_REDIRECT:http://localhost:5173/oauth/failure}

# CORS Configuration
spring.security.jwt.app.cors.front-end-url=${FRONT_END_URL:http://localhost:5173}